.pal>*{position:relative;z-index:1}
/* portada */
#intro{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:4svh 0 4svh;overflow:hidden}
#stage{--S:min(74vw,330px);position:relative;width:var(--S);margin-top:12svh;animation:fl 4.5s ease-in-out infinite alternate;will-change:transform}
@keyframes fl{from{transform:translate3d(0,-8px,0) rotate(-.6deg)}to{transform:translate3d(0,8px,0) rotate(.6deg)}}
#stage .env{position:relative;z-index:2;width:100%;max-width:none;transition:opacity .6s}
.envo{position:absolute;left:0;bottom:0;width:100%;z-index:3;opacity:0;scale:.92;transform-origin:50% 90%;transition:opacity .7s .2s,scale 1s cubic-bezier(.2,.8,.2,1) .2s;pointer-events:none}
.open .env{opacity:0}.open .envo{opacity:1;scale:1}
.noo .env{opacity:1!important}.noo .envo{display:none}
.flash{position:absolute;left:50%;top:50%;width:130%;aspect-ratio:1;margin:-65% 0 0 -65%;border-radius:50%;background:radial-gradient(circle,rgba(255,246,214,.95),rgba(255,226,150,.5) 35%,transparent 65%);opacity:0;transform:scale(.4);pointer-events:none;z-index:7}
.open .flash{animation:fs 1.1s ease-out}
@keyframes fs{0%{opacity:0;transform:scale(.4)}30%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
.u{display:grid;margin-top:5svh;width:100%;text-align:center}
.u>*{grid-area:1/1;transition:opacity 1s}
#open:disabled{opacity:.6}

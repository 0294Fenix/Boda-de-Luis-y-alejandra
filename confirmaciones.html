<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Confirmaciones · Boda de Ale y Luis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--n:#02214f;--iv:#f4f0e6;--g:#b88a3e;--ink:#1c2b4a;--mut:#5a6b8c;--ok:#1f6b45;--no:#8a3b3b;--sf:'Noto Serif',Georgia,serif;--sc:'Pinyon Script',cursive}
*{box-sizing:border-box;margin:0}
body{background:var(--iv);color:var(--ink);font:400 1rem/1.55 var(--sf);padding:0 0 48px}
header{background:var(--n);color:var(--iv);padding:30px 20px 26px;text-align:center}
header h1{font:400 clamp(2.4rem,11vw,3.2rem)/1.1 var(--sc)}
header p{font-style:italic;color:#c6cfe2;margin-top:4px}
main{width:min(100%,640px);margin:0 auto;padding:22px 16px 0}
[hidden]{display:none!important}
label{display:block;font-weight:700;margin:14px 0 6px}
input,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--n);border-radius:10px;padding:12px 14px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.btn{background:var(--n);color:var(--iv);border:0;border-radius:24px;padding:12px 24px;font-weight:700}
.btn.sec{background:transparent;color:var(--n);border:1.5px solid var(--n)}
.btn:disabled{opacity:.6;cursor:progress}
#lg{background:#fff;border-radius:16px;padding:8px 20px 22px;box-shadow:0 6px 18px rgba(2,33,79,.12)}
#lg .btn{margin-top:20px;width:100%}
.msg{min-height:1.5em;margin-top:12px;font-style:italic;color:var(--mut)}
.st{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.st div{background:#fff;border-radius:14px;padding:14px 16px;border-left:4px solid var(--g)}
.st div:first-child{grid-column:1/-1;background:var(--n);color:var(--iv);border-left-color:#e3bd73}
.st b{display:block;font-size:2.2rem;line-height:1.1}
.st span{font-style:italic;font-size:.95rem;color:var(--mut)}
.st div:first-child span{color:#c6cfe2}
.tb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 12px}
.tb input{grid-column:1/-1}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.acts .btn{padding:10px 18px;font-size:.95rem}
.row{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(2,33,79,.08)}
.row b{overflow-wrap:anywhere}
.row small{grid-column:1;color:var(--mut);font-style:italic}
.tag{grid-row:1/3;grid-column:2;font-weight:700;border-radius:20px;padding:4px 12px;font-size:.95rem;white-space:nowrap}
.tag.si{background:#dcefe3;color:var(--ok)}
.tag.no{background:#f3dcdc;color:var(--no)}
.del{grid-row:1/3;grid-column:3;background:none;border:0;color:var(--mut);font-size:1.5rem;line-height:1;padding:6px}
.del:hover{color:var(--no)}
.empty{text-align:center;font-style:italic;color:var(--mut);padding:26px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>Confirmaciones</h1>
  <p>Boda de Ale y Luis · 23 de diciembre de 2026</p>
</header>

<main>
  <form id="lg" autocomplete="on">
    <label for="em">Correo</label>
    <input id="em" type="email" autocomplete="username" required>
    <label for="pw">Contraseña</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" id="lb" type="submit">Entrar</button>
    <p class="msg" id="lm" role="status"></p>
  </form>

  <section id="ad" hidden>
    <div class="st">
      <div><b id="sP">0</b><span>Personas que asistirán</span></div>
      <div><b id="sY">0</b><span>Invitaciones que dijeron sí</span></div>
      <div><b id="sN">0</b><span>Invitaciones que dijeron no</span></div>
    </div>
    <div class="tb">
      <input id="q" type="search" placeholder="Buscar por nombre" aria-label="Buscar por nombre">
      <select id="f" aria-label="Filtrar por respuesta">
        <option value="">Todas las respuestas</option>
        <option value="si">Solo los que asistirán</option>
        <option value="no">Solo los que no asistirán</option>
      </select>
      <select id="o" aria-label="Ordenar">
        <option value="fecha">Más recientes primero</option>
        <option value="nombre">Por nombre (A–Z)</option>
      </select>
    </div>
    <div class="acts">
      <button class="btn" id="rl" type="button">Actualizar</button>
      <button class="btn sec" id="ex" type="button">Descargar CSV</button>
      <button class="btn sec" id="lo" type="button">Salir</button>
    </div>
    <div id="ls"></div>
    <p class="msg" id="am" role="status"></p>
  </section>
</main>

<script>
/* ============ CONFIGURACIÓN ============ */
const DB='https://libro-de-deseos-default-rtdb.firebaseio.com';
const API_KEY='AIzaSyCeeDjtlQWys1JD-omX8Lc5Nd54Qc3vL5I';   // Firebase > Configuración del proyecto > General > Clave de API web
/* ======================================= */

const $=s=>document.querySelector(s);
let tok='',rt='',rows=[];
const fmt=new Intl.DateTimeFormat('es-MX',{dateStyle:'medium',timeStyle:'short',timeZone:'America/Merida'});

if(API_KEY.startsWith('PEGA'))$('#lm').textContent='Falta pegar la clave de API web en este archivo (constante API_KEY).';

/* ---- inicio de sesión (Firebase Authentication, correo y contraseña) ---- */
const AUTH_ERR={
  INVALID_LOGIN_CREDENTIALS:'Correo o contraseña incorrectos.',
  INVALID_PASSWORD:'Correo o contraseña incorrectos.',
  EMAIL_NOT_FOUND:'Correo o contraseña incorrectos.',
  OPERATION_NOT_ALLOWED:'Activa el acceso con correo y contraseña en Firebase Authentication.',
  TOO_MANY_ATTEMPTS_TRY_LATER:'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.'
};
$('#lg').onsubmit=async e=>{
  e.preventDefault();
  const m=$('#lm'),b=$('#lb');
  if(API_KEY.startsWith('PEGA')){m.textContent='Falta pegar la clave de API web en este archivo (constante API_KEY).';return}
  b.disabled=true;m.textContent='Entrando…';
  try{
    const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(API_KEY),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value.trim(),password:$('#pw').value,returnSecureToken:true})});
    const d=await r.json();
    if(!r.ok){const c=((d.error&&d.error.message)||'').split(' ')[0];const err=new Error(c);err.code=c;throw err}
    tok=d.idToken;rt=d.refreshToken;$('#pw').value='';m.textContent='';
    $('#lg').hidden=true;$('#ad').hidden=false;
    await load();
  }catch(err){
    m.textContent=AUTH_ERR[err.code]||('No se pudo entrar'+(err.code?' ('+err.code+')':'. Revisa tu conexión')+'.');
  }
  b.disabled=false;
};
function logout(msg){
  tok=rt='';rows=[];
  $('#ad').hidden=true;$('#lg').hidden=false;$('#ls').textContent='';
  $('#lm').textContent=msg||'';
}
$('#lo').onclick=()=>logout('Sesión cerrada.');

/* ---- acceso a la base de datos (renueva el token si caduca) ---- */
async function refresh(){
  const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(API_KEY),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(rt)});
  if(!r.ok)throw new Error('refresh');
  const d=await r.json();tok=d.id_token;rt=d.refresh_token||rt;
}
async function db(path,opt){
  let r=await fetch(`${DB}/${path}.json?auth=${encodeURIComponent(tok)}`,opt);
  if(r.status===401){await refresh();r=await fetch(`${DB}/${path}.json?auth=${encodeURIComponent(tok)}`,opt)}
  return r;
}

async function load(){
  const m=$('#am');m.textContent='Cargando…';
  try{
    const r=await db('confirmaciones');
    if(!r.ok)throw new Error('http');
    const d=await r.json()||{};
    rows=Object.entries(d).filter(([k,v])=>v&&v.nombre).map(([k,v])=>({k,...v}));
    m.textContent='';render();
  }catch(e){
    logout('No se pudo cargar. Revisa las reglas de la base de datos o vuelve a entrar.');
  }
}

/* ---- pantalla ---- */
function visible(){
  const q=$('#q').value.trim().toLowerCase(),f=$('#f').value,o=$('#o').value;
  const L=rows.filter(x=>(!f||x.asistencia===f)&&(!q||x.nombre.toLowerCase().includes(q)));
  L.sort(o==='nombre'?(a,b)=>a.nombre.localeCompare(b.nombre,'es'):(a,b)=>(b.fecha||0)-(a.fecha||0));
  return L;
}
function render(){
  const yes=rows.filter(x=>x.asistencia==='si');
  $('#sP').textContent=yes.reduce((t,x)=>t+(Number(x.personas)||0),0);
  $('#sY').textContent=yes.length;
  $('#sN').textContent=rows.length-yes.length;
  const box=$('#ls');box.textContent='';
  const L=visible();
  if(!L.length){const p=document.createElement('p');p.className='empty';p.textContent=rows.length?'Ninguna respuesta coincide con la búsqueda.':'Todavía no hay confirmaciones.';box.append(p);return}
  L.forEach(x=>{
    const row=document.createElement('div'),n=document.createElement('b'),sm=document.createElement('small'),tag=document.createElement('span'),del=document.createElement('button');
    row.className='row';n.textContent=x.nombre;
    sm.textContent=[x.pases?`${x.pases} ${x.pases==1?'pase':'pases'}`:'',x.fecha?fmt.format(new Date(x.fecha)):''].filter(Boolean).join(' · ');
    const si=x.asistencia==='si';
    tag.className='tag '+(si?'si':'no');tag.textContent=si?`Sí · ${x.personas}`:'No asistirá';
    del.className='del';del.type='button';del.textContent='×';del.setAttribute('aria-label','Borrar la confirmación de '+x.nombre);
    del.onclick=async()=>{
      if(!confirm(`¿Borrar la confirmación de ${x.nombre}?`))return;
      try{const r=await db('confirmaciones/'+encodeURIComponent(x.k),{method:'DELETE'});if(!r.ok)throw 0;rows=rows.filter(y=>y.k!==x.k);render()}
      catch(e){$('#am').textContent='No se pudo borrar. Intenta de nuevo.'}
    };
    row.append(n,tag,del,sm);box.append(row);
  });
}
['#q','#f','#o'].forEach(s=>$(s).addEventListener('input',render));
$('#rl').onclick=load;

/* ---- descarga CSV (abre en Excel y Google Sheets) ---- */
const cell=v=>{v=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
$('#ex').onclick=()=>{
  const head=['Nombre','Asistencia','Personas','Pases','Fecha'];
  const body=visible().map(x=>[x.nombre,x.asistencia==='si'?'Sí':'No',x.personas,x.pases||'',x.fecha?fmt.format(new Date(x.fecha)):'']);
  const csv='\ufeff'+[head,...body].map(r=>r.map(cell).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='confirmaciones-boda.csv';
  document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
};
</script>
</body>
</html>
